<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="2">
    <title>{{.DisplayPodName}}</title>
</head>
<body>

<table style="margin: auto">
    <tr>
        <td>
            <h1>{{.DisplayPodName}}</h1>
        </td>
    </tr>
    <tr>
        <td>
            <img src="img/gopher.gif" alt="Dance! Dance! Dance!"/>
        </td>
    </tr>
    <tr>
        <td style="text-align: center">
            Refresh #<span id="counter"></span> &mdash; last refreshed at <span id="timestamp"></span>
            <br/>
            <button onclick="resetCounter()">Reset counter</button>
        </td>
    </tr>
</table>

<script>
    var count = parseInt(localStorage.getItem('dgRefreshCount') || '0', 10) + 1;
    localStorage.setItem('dgRefreshCount', count);
    document.getElementById('counter').textContent = count;
    document.getElementById('timestamp').textContent = new Date().toLocaleTimeString();

    function resetCounter() {
        localStorage.removeItem('dgRefreshCount');
        location.reload();
    }
</script>
</body>
</html>
